name: Extension CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
      - master
      - login

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check extension configuration
        run: npm run check

      - name: Run extension tests
        run: npm test

      - name: Build unpacked extension
        run: npm run build

      - name: Smoke-check unpacked package
        shell: bash
        run: |
          test -f dist/lazylex-local/manifest.json
          test -f dist/lazylex-local/background.js
          test -f dist/lazylex-local/popup.html
          test -f dist/lazylex-local/onboarding.html
          test ! -e dist/lazylex-local/server.js
          test ! -e dist/lazylex-local/firebase-functions
          node -e "const m=require('./dist/lazylex-local/manifest.json'); if(m.manifest_version!==3||m.name!=='LazyLex (Local QA)') process.exit(1)"
