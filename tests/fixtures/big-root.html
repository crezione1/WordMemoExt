<!doctype html>
<html lang="en" data-fixture="big-root.html">
<head>
    <meta charset="utf-8">
    <title>LazyLex fixture - Hostile: 20px root font size</title>
    <style>
        /* Nothing here targets a button at all. Every one of these properties is
           inherited, which is the point: before #52 no control declared any of them,
           so the same control genuinely was a different size and shape here before a
           `button {}` rule was even involved (criterion 4). */
        html { font-size: 20px; }
        body {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.4rem;
            font-weight: 700;
            font-style: italic;
            line-height: 2.6;
            letter-spacing: 3px;
            word-spacing: 8px;
            text-transform: uppercase;
            text-indent: 24px;
            text-align: right;
            direction: rtl;
        }
    </style>
</head>
<body>
    <h1>LazyLex hostile fixture</h1>

    <p id="word">Serendipity</p>

    <p id="sentence">The quick brown fox jumps over the lazy dog every single morning without fail.</p>

    <p id="saved">
        Here is a
        <span id="saved-slot"></span>
        that has already been saved.
    </p>

    <p>Ordinary page furniture, so the fixture has a host <button type="button">button</button> and an
        <input type="text" value="input"> of its own for the hostile rules to bite on.</p>

    <script src="/probe.js"></script>
</body>
</html>
