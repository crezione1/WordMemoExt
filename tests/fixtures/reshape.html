<!doctype html>
<html lang="en" data-fixture="reshape.html">
<head>
    <meta charset="utf-8">
    <title>LazyLex fixture - Hostile: button/input reshaped</title>
    <style>
        /* Exactly the overrides the issue tabulates: a square button, inflated
           padding, uppercased glyphs, plus a recoloured face so a leaked `color`
           would be obvious. The input rules are the criterion-3 attack -- in light
           DOM .edit-translation-input had no !important at all. */
        button {
            border-radius: 0 !important;
            padding: 12px !important;
            text-transform: uppercase !important;
            background: #00aa00 !important;
            color: #000000 !important;
            border: 3px dotted #0000ff !important;
            font-family: "Courier New", monospace !important;
            font-size: 22px !important;
            cursor: help !important;
        }
        input {
            border: 4px dashed #ff00ff !important;
            border-radius: 12px !important;
            padding: 20px !important;
            font-size: 28px !important;
            background: #222222 !important;
            color: #ffff00 !important;
        }
    </style>
</head>
<body>
    <h1>LazyLex hostile fixture</h1>

    <p id="word">Serendipity</p>

    <p id="sentence">The quick brown fox jumps over the lazy dog every single morning without fail.</p>

    <p id="saved">
        Here is a
        <span id="saved-slot"></span>
        that has already been saved.
    </p>

    <p>Ordinary page furniture, so the fixture has a host <button type="button">button</button> and an
        <input type="text" value="input"> of its own for the hostile rules to bite on.</p>

    <script src="/probe.js"></script>
</body>
</html>
