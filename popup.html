<!DOCTYPE html>

<body>
<div class="container" id="container">
    <div class="login-page" id="loginPage" style="display: none">
        <div>
            <h1 class="title-large">Welcome to LazyLex!</h1>
            <p class="desc">
                LazyLex is a Chrome extension that helps you improve your English vocabulary while you browse the
                web.
            </p>
        </div>

        <div class="img-container">
            <img src="./images/lazylex_logo.png" width="175" height="175" alt="LazyLex logo" />
        </div>

        <div class="buttons-container">
            <p class="desc">
                To use <a class="link" href="https://lazylex.com/" target="_blank">LazyLex</a> you need to
                register or log in.
            </p>
            <button class="btn accent" id="googleSignInBtn">Sign in with Google</button>
            <a class="btn" href="https://lazylex.com/#/login" target="_blank">LazyLex Login</a>
            <a class="btn" href="https://lazylex.com/#/register" target="_blank">Register</a>
            <p class="desc">
                Got a question?<br />
                Leave us a <span class="link uppercase">message</span>
            </p>
        </div>
    </div>

        <div id="homeContent" class="tab-content home-content">
            <div>
                <h2 class="title-large">My Word Lists</h2>
                
                <!-- Subscription Status -->
                <div class="subscription-status" id="subscriptionStatus" style="display: none;">
                    <div class="subscription-info">
                        <div class="subscription-plan" id="subscriptionPlan">Free Plan</div>
                        <div class="subscription-limit" id="subscriptionLimit">5 words per day</div>
                    </div>
                    <div class="subscription-usage">
                        <div class="usage-text" id="usageText">0 of 5 words used today</div>
                        <div class="usage-bar">
                            <div class="usage-progress" id="usageProgress" style="width: 0%;"></div>
                        </div>
                    </div>
                    <button class="btn upgrade-btn" id="upgradeBtn" style="display: none;">Upgrade to Premium</button>
                </div>
                
                <div class="add-word-container">
                    <input id="addWordInput" class="input add-word-input" type="text" placeholder="Add a new wordâ€¦" />
                    <button id="addWordBtn" class="btn accent add-word-btn" disabled>Add</button>
                </div>
                <div class="word-category-list" id="wordCategoryList">
                    <button class="word-category-btn" id="newWordsList">
                        <div class="word-category">
                            <span class="category-word-count" id="allWordsCounter">0</span>
                            <span class="category-title">All Words</span>
                        </div>
                    </button>
                    <button class="word-category-btn" id="savedWordsList">
                        <div class="word-category">
                            <span class="category-word-count" id="newWordsCounter">0</span>
                            <span class="category-title">New Worlds</span>
                        </div>
                    </button>
                    <button class="word-category-btn" id="learnedWordsList">
                        <div class="word-category">
                            <span class="category-word-count" id="learnedWordsCounter">0</span>
                            <span class="category-title">Learned Words</span>
                        </div>
                    </button>
